<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Modern Talent Hub</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
        background: #ebf1f6;
        color: #0f1b2d;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      img { width: 96px; height: auto; }
      h1 { margin: 0; font-size: 22px; }
      p { margin: 0; max-width: 320px; font-size: 15px; line-height: 1.45; color: #4a5a70; }
      button {
        margin-top: 8px;
        min-height: 46px;
        padding: 0 28px;
        border: 0;
        border-radius: 999px;
        background: #00a8f0;
        color: #0f1b2d;
        font-size: 15px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <img src="logo.png" alt="Modern Talent Hub" />
    <h1>You're offline</h1>
    <p>Modern Talent Hub needs an internet connection. Check your Wi-Fi or mobile data, then try again.</p>
    <button type="button" onclick="window.location.replace('https://www.rutechbranding.ink')">Try again</button>
  </body>
</html>
